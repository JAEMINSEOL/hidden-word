<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히든 워드</title>
<style>
  :root { --bg: #f6f5f2; --text: #1d1c1a; --muted: #6b6862; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141312; --text: #ecebe8; --muted: #a29f98; --accent: #fb923c; } }
  :root[data-theme="dark"] { --bg: #141312; --text: #ecebe8; --muted: #a29f98; --accent: #fb923c; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  p { color: var(--muted); } a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>히든 워드</h1>
  <p>친구끼리 하는 단어 유사도 게임을 준비하고 있습니다.</p>
  <p><a href="lab/">유사도 실험실 (개발용)</a></p>
</main>
</body>
</html>
