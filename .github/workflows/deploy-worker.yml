name: Deploy Worker
# main에 worker 코드가 바뀌면 Cloudflare에 배포한다. Actions 탭에서 수동 실행도 된다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
concurrency: deploy-worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Cloudflare 설정 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::저장소 Secrets에 CLOUDFLARE_API_TOKEN과 CLOUDFLARE_ACCOUNT_ID를 등록하세요. (docs/M1-SETUP.md 참고)"
            exit 1
          fi
      - run: npx wrangler deploy
